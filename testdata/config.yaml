  # Lifecycle
  onboarding:
    weight: 10
  login:
    weight: 30
  logout:
    weight: 20

  # Core CEX behavior
  cex_view_product:
    weight: 40
  cex_deposit:
    weight: 8
  cex_place_spot_order:
    weight: 25
  cex_cancel_spot_order:
    weight: 10
  cex_withdraw:
    weight: 6
  cex_view_balances:
    weight: 15

