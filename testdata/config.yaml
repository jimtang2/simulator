verbose: true
action_per_turn: 100
time_between_turn: 50
otlp_receiver_endpoint: http://localhost:4488/v1/logs

players:
  count: 50000
  init_states:
    - name: brand_new
      weight: 15
      state:
        user.id_prefix: "new"
        onboarded: false
        logged_in: false
        cex_balance_usdt: 0
        cex_balance_btc: 0
        cex_balance_eth: 0
        cex_balance_bnb: 0
        cex_balance_sol: 0
        cex_open_spot_orders: 0
        cex_open_futures_positions: 0
        cex_earn_balance_usdt: 0
        cex_pending_rewards_usdt: 0
        cex_kyc_status: "not_started"
        cex_2fa_enabled: false
        cex_api_enabled: false
        cex_push_enabled: false
        cex_withdrawal_address_count: 0
        cex_known_device_count: 0
        cex_home_country: "US"

    - name: onboarded_inactive
      weight: 25
      state:
        user.id_prefix: "inactive"
        onboarded: true
        logged_in: false
        cex_balance_usdt: 300
        cex_balance_btc: 0
        cex_balance_eth: 0
        cex_balance_bnb: 0
        cex_balance_sol: 0
        cex_open_spot_orders: 0
        cex_open_futures_positions: 0
        cex_earn_balance_usdt: 0
        cex_pending_rewards_usdt: 0
        cex_kyc_status: "pending"
        cex_2fa_enabled: false
        cex_api_enabled: false
        cex_push_enabled: false
        cex_withdrawal_address_count: 0
        cex_known_device_count: 1
        cex_home_country: "DE"

    - name: active_retail
      weight: 35
      state:
        user.id_prefix: "retail"
        onboarded: true
        logged_in: true
        cex_balance_usdt: 1200
        cex_balance_btc: 0
        cex_balance_eth: 0
        cex_balance_bnb: 0
        cex_balance_sol: 0
        cex_open_spot_orders: 1
        cex_open_futures_positions: 0
        cex_earn_balance_usdt: 200
        cex_pending_rewards_usdt: 5
        cex_kyc_status: "approved"
        cex_kyc_tier: "basic"
        cex_2fa_enabled: true
        cex_2fa_method: "totp"
        cex_api_enabled: false
        cex_push_enabled: true
        cex_withdrawal_address_count: 2
        cex_known_device_count: 2
        cex_home_country: "BR"

    - name: active_pro
      weight: 20
      state:
        user.id_prefix: "pro"
        onboarded: true
        logged_in: true
        cex_balance_usdt: 8000
        cex_balance_btc: 0.2
        cex_balance_eth: 1.5
        cex_balance_bnb: 10
        cex_balance_sol: 20
        cex_open_spot_orders: 5
        cex_open_futures_positions: 3
        cex_earn_balance_usdt: 3000
        cex_pending_rewards_usdt: 50
        cex_kyc_status: "approved"
        cex_kyc_tier: "advanced"
        cex_2fa_enabled: true
        cex_2fa_method: "hardware_key"
        cex_api_enabled: true
        cex_push_enabled: false
        cex_withdrawal_address_count: 5
        cex_known_device_count: 3
        cex_home_country: "SG"

    - name: high_value_whale
      weight: 5
      state:
        user.id_prefix: "whale"
        onboarded: true
        logged_in: true
        cex_balance_usdt: 50000
        cex_balance_btc: 2.5
        cex_balance_eth: 25
        cex_balance_bnb: 200
        cex_balance_sol: 500
        cex_open_spot_orders: 10
        cex_open_futures_positions: 8
        cex_earn_balance_usdt: 20000
        cex_pending_rewards_usdt: 300
        cex_kyc_status: "approved"
        cex_kyc_tier: "advanced"
        cex_2fa_enabled: true
        cex_2fa_method: "hardware_key"
        cex_api_enabled: true
        cex_push_enabled: false
        cex_withdrawal_address_count: 10
        cex_known_device_count: 2
        cex_home_country: "AE"

